name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: connect4_arena
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U user -d connect4_arena"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://user:password@localhost:5433/connect4_arena
      TEST_DATABASE_URL: postgresql+asyncpg://user:password@localhost:5433/connect4_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Create test database
        run: |
          PGPASSWORD=password psql -h localhost -p 5433 -U user -d connect4_arena \
            -c 'CREATE DATABASE connect4_test OWNER "user";'

      - name: Apply migrations to both databases
        working-directory: backend
        run: |
          DATABASE_URL=$DATABASE_URL alembic upgrade head
          DATABASE_URL=$TEST_DATABASE_URL alembic upgrade head

      - name: Run pytest
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run vitest (with coverage gate)
        working-directory: frontend
        run: npm test

  lint:
    name: Lint (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run eslint
        working-directory: frontend
        run: npm run lint
