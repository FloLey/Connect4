[pytest]
testpaths = tests
pythonpath = ..
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
# Coverage gate progression:
#   Tier 1 baseline: 65
#   Tier 2 (split + new modules): 70
#   Tier 4.B (ai.py LLM paths via fakes, game_runner loop tests, _cleanup_once
#     helper extracted + tested): 75
# Remaining headroom is in main.py's lifespan and websocket_manager.py — both
# unblocked by Tier 4.C's WS test rework.
addopts = -ra --cov=app --cov-fail-under=75
